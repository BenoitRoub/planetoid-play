<script>
// keep a copy of the app on the phone: it opens even when the network is slow, and updates when it can
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
// hide the loading screen once the game has drawn its first frame
(function wait() { if (window.__ready) { var l = document.getElementById('loading'); if (l) l.remove(); } else setTimeout(wait, 150); })();
</script>

[hidden] { display: none !important; }

<body>
<title>Shardholm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* « La carte » in the validated interface, direction A « Pierre et or » (GDD 04/11): the theme and the frame every game
   page shares (the touches, the windows, the message) come from ui/ (ui/theme.ts injects them); this sheet only lays
   out what is the page's own: its canvases, the raid's counters, the loading screen, the lobby. Sizes are iPhone points. */
html, body { background: #6c8a3e; }
/* the canvases at the screen's size as measured below (not the window's 100%: see the script) */
#scene, #warmap, #clouds { position: fixed; top: 0; left: 0; width: var(--pw, 100%); height: var(--ph, 100%); display: block; touch-action: none; }
html.rot #scene, html.rot #warmap, html.rot #clouds { width: 100%; height: 100%; }
#warmap, #clouds { display: none; }
body.map #warmap, body.map #clouds { display: block; }
/* the war map has the village's HUD without « Construire » (GDD 04/11); placing a building hides what would get in the way */
body.map #btn-build, body.placing #btn-build, body.placing .units, body.placing #btn-view { display: none; }
/* tracing the wall: its tools replace the shop's button and the selection's */
body.walling #btn-build, body.walling #acts, body.walling .units, body.walling #btn-view { display: none; }
.act.on .face { border-color: #5a4210; box-shadow: 0 2px 0 var(--ink), 0 0 0 2px var(--gold), 0 0 10px 2px rgba(255, 210, 90, .7), inset 0 1.5px 0 rgba(255, 255, 255, .7); }
#clouds { pointer-events: none; }
.ctr.army { width: 58px; }
/* the runes (GDD 03/11), the rank and the trophies: the counters are buttons; a rune's colour says its rarity (--rc) */
button.ctr { border: 0; padding: 0; background: none; pointer-events: auto; cursor: pointer; font: inherit; color: inherit; text-align: left; }
/* the sanctuary's window (05/11): our runes on the left, the troops and the defences with their places on the right;
   a rune is a stone of its rarity's colour with its type's glyph, its bonus under it */
.win.rwin .well { padding: 8px 8px 4px; }
.rwrap { display: flex; gap: 10px; align-items: stretch; }
.rcol { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rcol.inv { width: 232px; flex: none; padding-right: 10px; border-right: 1.5px solid rgba(242, 195, 90, .35); }
.rcol.items { flex: 1; }
.rhead { display: flex; align-items: center; gap: 4px; height: 20px; padding-left: 2px; }
.rhead .ic { width: 18px; height: 18px; } .rhead .n { font-size: 13px; }
.rhead .soft { margin-left: auto; font: 600 11px "Fredoka", system-ui, sans-serif; color: var(--soft-text); opacity: .85; }
.rscroll { display: flex; flex-direction: column; gap: 5px; max-height: min(318px, calc(100 * var(--vh, 1vh) - 178px)); overflow: auto; -webkit-overflow-scrolling: touch; padding: 3px 2px 4px; }
.rinv { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.rn { position: relative; flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; width: 50px; height: 54px; border-radius: 8px;
  border: 1.5px solid var(--ink); background: var(--card); box-shadow: 0 2px 0 var(--ink); cursor: pointer; font: inherit; color: inherit; padding: 2px 1px; }
.rn > .ic { width: 30px; height: 30px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .35)); }
.rn .rbn { display: flex; align-items: center; gap: 1px; font-size: 10.5px; line-height: 1; }
.rn .rbn .ic { width: 11px; height: 11px; }
.rn.r0 { background: linear-gradient(#f4f0e8, #d9d2c4); } .rn.r1 { background: linear-gradient(#e6f3ff, #b9dbfb); } .rn.r2 { background: linear-gradient(#f3e8ff, #d4b8fb); } .rn.r3 { background: linear-gradient(#fff4d6, #f7d685); }
.rn.pick { outline: 3px solid var(--gold); outline-offset: 1px; box-shadow: 0 2px 0 var(--ink), 0 0 12px 2px rgba(255, 210, 90, .8); }
.rn.empty { background: rgba(0, 0, 0, .18); border: 1.5px dashed rgba(246, 239, 224, .55); box-shadow: none; }
.rn.empty.want { border-color: var(--gold); background: rgba(242, 195, 90, .2); animation: rwant 1.1s ease-in-out infinite; }
@keyframes rwant { 50% { background: rgba(242, 195, 90, .38); } }
.rn.locked { cursor: default; background: rgba(0, 0, 0, .3); border-color: rgba(0, 0, 0, .45); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); gap: 1px; }
.rn.locked > .ic { width: 15px; height: 15px; opacity: .85; }
.rn.locked .lvl { width: 19px; height: 21px; } .rn.locked .lvl svg { width: 19px; height: 21px; } .rn.locked .lvl .n { font-size: 10px; }
.rn.dead { filter: grayscale(.75) brightness(.8); }
.rrow { display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 2px 6px 2px 4px; border-radius: 8px; background: rgba(0, 0, 0, .2); }
.rrow.fit { background: rgba(242, 195, 90, .16); box-shadow: inset 0 0 0 1.5px rgba(242, 195, 90, .75); }
.rrow.nofit { opacity: .4; }
.rnwho { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
.rnwho .pic { flex: none; width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--card); object-fit: contain; }
.rnwho .pic.port { object-fit: cover; object-position: 50% 20%; }
.rnwho .n { font-size: 13px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; }
.rplaces { display: flex; gap: 6px; flex: none; }
.rnos { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; text-align: center; }
.rnos .ic.big { width: 72px; height: 72px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35)); }
.rfoot { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; margin-top: 4px; }
.rfoot .say { margin: 0 4px !important; }
.rfoot.ask { border-radius: 8px; background: rgba(0, 0, 0, .25); padding: 3px 6px; }
.rfoot.ask .say { flex: 1; text-align: left !important; }
.rnone { margin: 14px 4px !important; }
/* a level that waits for the maison, in the upgrade window */
.foot .slock { display: flex; align-items: center; gap: 6px; } .foot .slock > .ic { width: 24px; height: 24px; }
/* a phone held sideways: a narrower inventory */
@media (max-width: 760px) { .rcol.inv { width: 176px; } .rnwho .n { font-size: 12px; } }
/* the game's end: the podium */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 4px 0 8px; }
.podium .pd { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 92px; }
.podium .pd .blk { width: 100%; border-radius: 6px 6px 0 0; border: 1.5px solid var(--ink); background: var(--stone); display: grid; place-items: center; }
.podium .pd .ic { width: 22px; height: 22px; } .podium .pd .n { font-size: 12px; }
.podium .pd.me .blk { background: linear-gradient(#ffe7a6, #e7ae45); }
/* the counters of the raid */
.rhud, .rhud > div { pointer-events: none; }
.rhud button { pointer-events: auto; }
.rhud { position: fixed; inset: 0; z-index: 2; }
body.raid .hud, body.raid .acts, body.raid .bname { display: none; }
body.replay .rhud .deck { display: none; }
/* the tutorial (GDD 04/11, « un petit tuto »): the récolteur, as an advisor, says what to do next, the button to touch glows. Its look
   (validated 05/11, direction B « le conseiller au bord »): his portrait over the left edge, under the counters, a
   parchment card beside it; the middle of the screen stays free */
#guide { position: fixed; left: calc(var(--l) + 30px); top: calc(var(--t) + 152px); z-index: 5; display: flex; align-items: center; gap: 10px;
  max-width: min(300px, calc(46 * var(--vw, 1vw))); padding: 8px 12px 9px 50px; border-radius: 12px; background: var(--card);
  box-shadow: 0 0 0 1.5px var(--ink), 0 2px 0 var(--ink), inset 0 0 0 2.5px rgba(242, 195, 90, .75); pointer-events: auto; }
#guide[hidden] { display: none; }
#guide .gp { position: absolute; left: -26px; top: 50%; transform: translateY(-50%); width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #e8c88a;
  box-shadow: 0 0 0 2.5px var(--gold), 0 0 0 4px var(--ink), 0 3px 0 4px var(--ink); }
#guide .gp img { width: 100%; height: 100%; object-fit: cover; }
#guide .gt { font: 600 12.5px/1.28 "Fredoka", system-ui, sans-serif; color: var(--ink); }
#guide .gn { flex: none; border: 1.5px solid var(--ink); border-radius: 9px; padding: 4px 10px 5px; background: var(--btn-go); color: #fff; font: 600 12px "Fredoka", system-ui, sans-serif; text-shadow: var(--o); box-shadow: 0 2px 0 var(--ink); cursor: pointer; }
#guide .gn[hidden] { display: none; }
#guide .gx { position: absolute; right: 8px; bottom: -17px; border: 0; padding: 0; background: none; color: #fff6e2; text-shadow: var(--o); font: 600 10px "Fredoka", system-ui, sans-serif; text-decoration: underline; cursor: pointer; }
/* in a live raid, the left column has the loot: the card goes to the top, in the middle */
body.raid:not(.replay) #guide { left: 50%; top: calc(var(--t) + 64px); transform: translateX(-50%); }
@keyframes hintpulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 220, 90, 0)); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(255, 220, 90, .95)); } }
.hint { animation: hintpulse 1.1s ease-in-out infinite; }
.stile.gift .price > .n:first-child { color: #9dff7a; }
.ctr.hp .track i { background: linear-gradient(#ffb0a0, #ff5a47 60%, #c22a20); }
.ctr.hp { width: 120px; }
/* a live raid shows its loot where the board has it; the maison's life and the defenders stay for a battle watched again */
body.raid:not(.replay) .rhud .tl, body.replay .rhud .rloot { display: none; }
.lootpop { position: fixed; z-index: 3; pointer-events: none; transition: none; }
.rhud .tl { position: absolute; left: calc(var(--l) + 8px); top: calc(var(--t) + 8px); display: flex; flex-direction: column; gap: 12px; }
/* scouting another village (05/11, « Explorer »): the village as it stands, our HUD put away; what a raid could take at
   the top left, its name in the middle, Retour and Attaquer at the bottom corners (the HUD's own big buttons) */
.shud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.shud button { pointer-events: auto; }
.shud .rloot .lab { font-size: 11px; color: #e9e1cd; margin-top: -1px; }
.shud .rwho { flex-direction: column; gap: 3px; }
.shud .rwho .top { display: flex; align-items: center; gap: 5px; }
.shud .rwho .st { display: flex; align-items: center; gap: 10px; }
.shud .rwho .st .n { display: flex; align-items: center; gap: 2px; font-size: 12px; }
.shud .rwho .st .ic { width: 16px; height: 16px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .45)); }
.shud .btn.off .face { filter: grayscale(.85) brightness(.9); }
.shud .shint { position: absolute; left: 50%; bottom: calc(var(--b) + 4px); transform: translateX(-50%); font-size: 12px; opacity: .92; text-align: center; }
body.scout .hud > .tl, body.scout .hud > .tc, body.scout .hud > .tr, body.scout .hud > .bl, body.scout .hud > .br, body.scout .acts, body.scout #guide { display: none; }
/* the scouting view's touched building: its name, and under it what it would give */
.bname.scouted { flex-direction: column; gap: 3px; }
.bname.scouted .row { display: flex; align-items: center; gap: 5px; }
.bname.scouted .row .ic { width: 18px; height: 18px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .45)); }
.bname.scouted .row .n.s { font-size: 13px; }
.foot .go + .go { margin-left: 10px; }
.foot .go.nav .face { background: var(--btn-nav); }
/* the loading screen: the icon, the name, a bar that moves on with the steps (the home-screen icon's colours) */
#loading { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: radial-gradient(circle at 50% 38%, #ffdc8c, #f0a24a 46%, #b65a22 100%); }
#loading .logo { width: 92px; height: 92px; border-radius: 21px; background: #e8953a center / cover; box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px var(--ink), 0 10px 24px rgba(60, 20, 0, .35); }
#loading .title { font-size: 40px; letter-spacing: 1px; text-shadow: 0 2.4px 0 var(--text-ink), 2.4px 0 0 var(--text-ink), -2.4px 0 0 var(--text-ink), 0 -2.4px 0 var(--text-ink), 1.8px 1.8px 0 var(--text-ink), -1.8px 1.8px 0 var(--text-ink), 1.8px -1.8px 0 var(--text-ink), -1.8px -1.8px 0 var(--text-ink), 0 4px 0 var(--text-ink), 0 7px 12px rgba(60, 20, 0, .35); }
#loading .ctr { width: 220px; height: 13px; margin-top: 6px; }
#loading .ctr .track i { width: 8%; background: linear-gradient(#fff2a8, #ffc93e 60%, #e2780f); transition: width .3s; }
#loading .step { font-size: 12px; }
body.winopen #toast { top: calc(var(--t) + 4px); }
#btn-multi .badge.code { top: auto; bottom: -7px; right: 50%; transform: translateX(50%); font-size: 8px; min-width: 0; }
#btn-multi .badge.code:empty { display: none; }
.lerr { max-width: 420px; padding: 0 24px; text-align: center; font: 600 14px/1.35 "Fredoka", system-ui, sans-serif; }
.lerr .row { justify-content: center; margin-top: 14px; }
/* playing with others (docs/MULTI.md): the lobby, a window of the theme */
#lobby { position: fixed; inset: 0; z-index: 7; display: none; background: rgba(12, 10, 6, .42); }
#lobby.open { display: block; }
#lobby .win { position: absolute; width: min(440px, calc(100vw - 32px)); }
#lobby .well { max-height: calc(100vh - var(--t) - var(--b) - 70px); overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px; }
#lobby p, #lobby li { font: 600 12.5px/1.35 "Fredoka", system-ui, sans-serif; color: #f6efe0; margin: 0 0 8px; }
#lobby h3 { margin: 4px 0 6px; font: normal 13px/1 "Lilita"; color: #fff; text-shadow: var(--o); }
#lobby .row { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; }
#lobby input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border: 1.5px solid var(--ink); border-radius: 7px; background: #fffaf0; font: 600 14px "Fredoka", system-ui, sans-serif; color: var(--ink); -webkit-user-select: text; user-select: text; }
#lobby input.code { text-transform: uppercase; letter-spacing: 3px; font-family: "Lilita"; max-width: 120px; }
#lobby .seg { display: flex; gap: 5px; }
#lobby .seg button { height: 28px; min-width: 34px; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 7px; background: var(--stone); font: normal 14px "Lilita"; color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
#lobby .seg button.on { background: linear-gradient(#ffe7a6, #e7ae45); }
#lobby .lbl { font: 600 12px "Fredoka", system-ui, sans-serif; color: #e9e1cd; }
#lobby .sep { margin: 10px 0 9px; }
#lobby .msg { min-height: 15px; font: 600 12px/1.3 "Fredoka", system-ui, sans-serif; color: #ff9a88; }
#lobby .msg.ok { color: #b6ff7a; }
#lobby .big { font: normal 28px/1 "Lilita"; letter-spacing: 6px; color: #fff; text-shadow: var(--o); }
#lobby ul { list-style: none; margin: 0 0 8px; padding: 0; }
#lobby li { display: flex; align-items: center; gap: 7px; padding: 3px 0; margin: 0; }
#lobby li i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); background: #8f8676; flex: none; }
#lobby li i.on { background: #4cc93f; }
#lobby li.me { font-weight: 700; }
#lobby li small { color: #e9e1cd; font-weight: 600; }
/* the game in landscape at once (Benoit, 04/11): a phone held upright shows the whole page turned a quarter clockwise
   (ui/rotate.ts turns the touches back); the safe areas follow the turn, and the sizes measured on the screen are
   swapped (--vw, --vh: a hundredth of the page's width and height) */
:root { --vw: 1vw; --vh: 1vh; }
html.rot { --vw: calc(var(--ph) / 100); --vh: calc(var(--pw) / 100); }
html.rot body { position: fixed; top: 0; left: 0; width: var(--ph); height: var(--pw); transform-origin: 0 0; transform: translateX(var(--pw)) rotate(90deg);
  --l: max(16px, env(safe-area-inset-top, 0px)); --r: max(16px, env(safe-area-inset-bottom, 0px));
  --t: max(6px, env(safe-area-inset-right, 0px)); --b: max(10px, env(safe-area-inset-left, 0px)); }
</style>
<script>
// before anything draws: turned or not, and the screen's size (?rot turns it on a computer, for tests). The game
// installed on an iPhone is given a window too short by the status bar after a turn or a return to the app, and
// the page's ground showed under it as a green band (Benoit, 05/11): there, the screen's own size is the size; and
// everywhere the size is measured again a moment after anything that may change it, as it comes late.
(function () {
  var d = document.documentElement, q = matchMedia('(orientation: portrait) and (pointer: coarse)'), f = /[?&]rot(&|$)/.test(location.search);
  var port = matchMedia('(orientation: portrait)'), ios = navigator.standalone === true;
  function set() {
    var w = innerWidth, h = innerHeight;
    if (ios && screen.width && screen.height) {
      var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height);
      w = Math.max(w, port.matches ? a : b); h = Math.max(h, port.matches ? b : a);
    }
    window.__screen = { w: w, h: h };
    d.style.setProperty('--pw', w + 'px'); d.style.setProperty('--ph', h + 'px'); d.classList.toggle('rot', q.matches || f); scrollTo(0, 0);
  }
  var later = 0;
  function soon() { set(); clearTimeout(later); later = setTimeout(function () { set(); later = setTimeout(set, 600); }, 150); }
  set(); addEventListener('resize', soon); addEventListener('orientationchange', soon); addEventListener('pageshow', soon);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) soon(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', soon);
  if (q.addEventListener) q.addEventListener('change', soon);
})();
</script>

<div class="hud" id="hud">
  <div class="tl">
    <div class="ctr cry" id="c-cry"><span class="track"><i></i></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-crystal"/></svg><span class="max n"></span></div>
    <div class="ctr mush" id="c-mush"><span class="track"><i></i></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-mushroom"/></svg><span class="max n"></span></div>

    <button class="ctr army runes" id="c-rune" aria-label="Tes runes" data-do="runes"><span class="track"></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-rune"/></svg></button>
  </div>

    <div class="ctr builders" id="c-bld" aria-label="Ouvriers libres"><span class="track"></span><span class="v n">2/2</span><svg class="ic" aria-hidden="true"><use href="#i-hammer"/></svg></div>

  </div>
  <div class="tr">

    <button class="btn small neutral" id="btn-sound" aria-label="Le son : musique et bruitages"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-sound"/></svg></span></button>
    <button class="btn small neutral" id="btn-multi" aria-label="Jouer à plusieurs"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-person"/></svg></span><span class="badge code n" id="multi-lab"></span></button>
    <button class="btn small neutral" id="btn-away" aria-label="Avancer le monde d’une heure"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-hourglass"/></svg></span></button>
    <button class="btn small neutral" id="btn-speed" aria-label="Vitesse du temps"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-fast"/></svg></span><span class="badge n" id="speed-v">×1</span></button>
  </div>
