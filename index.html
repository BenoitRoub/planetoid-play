<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shardholm">
<meta name="theme-color" content="#1d1409">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
// keep a copy of the app on the phone: it opens even when the network is slow, and updates when it can
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
// hide the loading screen once the game has drawn its first frame
(function wait() { if (window.__ready) { var l = document.getElementById('loading'); if (l) l.remove(); } else setTimeout(wait, 150); })();
</script>
<style>
[hidden] { display: none !important; }
html, body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
/* the game is played in landscape: a phone held upright shows it turned a quarter (pages/carte.html, ui/rotate.ts) */
</style>
</head>
<body>
<title>Shardholm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* « La carte » in the validated interface, direction A « Pierre et or » (GDD 04/11): the theme and the frame every game
   page shares (the touches, the windows, the message) come from ui/ (ui/theme.ts injects them); this sheet only lays
   out what is the page's own: its canvases, the raid's counters, the loading screen, the lobby. Sizes are iPhone points. */
html, body { background: #6c8a3e; }
#scene, #warmap, #clouds { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#warmap, #clouds { display: none; }
body.map #warmap, body.map #clouds { display: block; }
/* the war map has the village's HUD without « Construire » (GDD 04/11); placing a building hides what would get in the way */
body.map #btn-build, body.placing #btn-build, body.placing .units, body.placing #btn-view { display: none; }
/* tracing the wall: its tools replace the shop's button and the selection's */
body.walling #btn-build, body.walling #acts, body.walling .units, body.walling #btn-view { display: none; }
.act.on .face { border-color: #5a4210; box-shadow: 0 2px 0 var(--ink), 0 0 0 2px var(--gold), 0 0 10px 2px rgba(255, 210, 90, .7), inset 0 1.5px 0 rgba(255, 255, 255, .7); }
#clouds { pointer-events: none; }
.ctr.army { width: 58px; }
/* the runes (GDD 03/11): the counter is a button; a rune's colour says its rarity */
button.ctr.runes { border: 0; padding: 0; background: none; pointer-events: auto; cursor: pointer; font: inherit; color: inherit; text-align: left; }
.rn { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: 58px; height: 64px; border-radius: 8px;
  border: 1.5px solid var(--ink, #2a2016); background: var(--card, #efe6d2); box-shadow: 0 2px 0 var(--ink, #2a2016); cursor: pointer; font: inherit; color: inherit; padding: 2px; }
.rn .ic { width: 28px; height: 28px; }
.rn .n { font-size: 10px; line-height: 1.05; text-align: center; }
.rn.r0 .ic { filter: grayscale(1) brightness(1.05); } .rn.r1 .ic { filter: hue-rotate(10deg) saturate(1.4); }
.rn.r2 .ic { filter: hue-rotate(80deg) saturate(1.6); } .rn.r3 .ic { filter: hue-rotate(-150deg) saturate(2) brightness(1.15); }
.rn.r0 { background: #e9e4da; } .rn.r1 { background: #d9ecfb; } .rn.r2 { background: #ead9fb; } .rn.r3 { background: #fbecc4; }
.rn.empty { background: rgba(0, 0, 0, .18); border-style: dashed; box-shadow: none; }
.rn.empty .ic { opacity: .3; }
.rn.pick { outline: 3px solid #ffd34a; outline-offset: 1px; }
.rslots { display: flex; flex-direction: column; gap: 6px; }
.rslot { display: flex; align-items: center; gap: 8px; }
.rslot .who { width: 92px; font: 600 12px/1.2 "Fredoka", system-ui, sans-serif; color: #f6efe0; }
.rinv { display: flex; flex-wrap: wrap; gap: 6px; min-height: 66px; }
.efell.rune.r0 .ic { filter: grayscale(1); } .efell.rune.r2 .ic { filter: hue-rotate(80deg) saturate(1.6); } .efell.rune.r3 .ic { filter: hue-rotate(-150deg) saturate(2); }
/* the counters of the raid */
.rhud, .rhud > div { pointer-events: none; }
.rhud button { pointer-events: auto; }
.rhud { position: fixed; inset: 0; z-index: 2; }
body.raid .hud, body.raid .acts, body.raid .bname { display: none; }
body.replay .rhud .deck { display: none; }
/* the tutorial (GDD 04/11, « un petit tuto »): the harvester says what to do next, the button to touch glows */
#guide { position: fixed; left: 50%; bottom: calc(var(--b, 0px) + 92px); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px;
  max-width: min(460px, 86vw); padding: 7px 12px 8px 8px; border-radius: 12px; background: rgba(38, 33, 27, .9);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .35), inset 0 0 0 1.5px rgba(242, 195, 90, .6); pointer-events: auto; }
#guide[hidden] { display: none; }
#guide .gp { flex: none; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: #e8c88a; box-shadow: 0 0 0 2px var(--ink, #2a2016); }
#guide .gp img { width: 100%; height: 100%; object-fit: cover; }
#guide .gt { font: 600 13px/1.3 "Fredoka", system-ui, sans-serif; color: #f6efe0; }
#guide .gx { flex: none; align-self: flex-start; margin-left: 4px; border: 0; background: none; color: #c9b893; font: 600 10.5px "Fredoka", system-ui, sans-serif; text-decoration: underline; cursor: pointer; }
body.raid:not(.replay) #guide { bottom: auto; top: calc(var(--t) + 64px); }
@keyframes hintpulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 220, 90, 0)); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(255, 220, 90, .95)); } }
.hint { animation: hintpulse 1.1s ease-in-out infinite; }
.stile.gift .price > .n:first-child { color: #9dff7a; }
.ctr.hp .track i { background: linear-gradient(#ffb0a0, #ff5a47 60%, #c22a20); }
.ctr.hp { width: 120px; }
/* a live raid shows its loot where the board has it; the maison's life and the defenders stay for a battle watched again */
body.raid:not(.replay) .rhud .tl, body.replay .rhud .rloot { display: none; }
.lootpop { position: fixed; z-index: 3; pointer-events: none; transition: none; }
.rhud .tl { position: absolute; left: calc(var(--l) + 8px); top: calc(var(--t) + 8px); display: flex; flex-direction: column; gap: 12px; }
/* the loading screen: the icon, the name, a bar that moves on with the steps (the home-screen icon's colours) */
#loading { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: radial-gradient(circle at 50% 38%, #ffdc8c, #f0a24a 46%, #b65a22 100%); }
#loading .logo { width: 92px; height: 92px; border-radius: 21px; background: #e8953a center / cover; box-shadow: 0 0 0 2px var(--ink), 0 4px 0 2px var(--ink), 0 10px 24px rgba(60, 20, 0, .35); }
#loading .title { font-size: 40px; letter-spacing: 1px; text-shadow: 0 2.4px 0 var(--text-ink), 2.4px 0 0 var(--text-ink), -2.4px 0 0 var(--text-ink), 0 -2.4px 0 var(--text-ink), 1.8px 1.8px 0 var(--text-ink), -1.8px 1.8px 0 var(--text-ink), 1.8px -1.8px 0 var(--text-ink), -1.8px -1.8px 0 var(--text-ink), 0 4px 0 var(--text-ink), 0 7px 12px rgba(60, 20, 0, .35); }
#loading .ctr { width: 220px; height: 13px; margin-top: 6px; }
#loading .ctr .track i { width: 8%; background: linear-gradient(#fff2a8, #ffc93e 60%, #e2780f); transition: width .3s; }
#loading .step { font-size: 12px; }
/* an attack on its way: the message goes under its banner */
body:has(#incoming:not([hidden])) #toast { top: calc(var(--t) + 72px); }
body.winopen #toast { top: calc(var(--t) + 4px); }
#btn-multi .badge.code { top: auto; bottom: -7px; right: 50%; transform: translateX(50%); font-size: 8px; min-width: 0; }
#btn-multi .badge.code:empty { display: none; }
.lerr { max-width: 420px; padding: 0 24px; text-align: center; font: 600 14px/1.35 "Fredoka", system-ui, sans-serif; }
.lerr .row { justify-content: center; margin-top: 14px; }
/* playing with others (docs/MULTI.md): the lobby, a window of the theme */
#lobby { position: fixed; inset: 0; z-index: 7; display: none; background: rgba(12, 10, 6, .42); }
#lobby.open { display: block; }
#lobby .win { position: absolute; width: min(440px, calc(100vw - 32px)); }
#lobby .well { max-height: calc(100vh - var(--t) - var(--b) - 70px); overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px; }
#lobby p, #lobby li { font: 600 12.5px/1.35 "Fredoka", system-ui, sans-serif; color: #f6efe0; margin: 0 0 8px; }
#lobby h3 { margin: 4px 0 6px; font: normal 13px/1 "Lilita"; color: #fff; text-shadow: var(--o); }
#lobby .row { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; }
#lobby input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border: 1.5px solid var(--ink); border-radius: 7px; background: #fffaf0; font: 600 14px "Fredoka", system-ui, sans-serif; color: var(--ink); -webkit-user-select: text; user-select: text; }
#lobby input.code { text-transform: uppercase; letter-spacing: 3px; font-family: "Lilita"; max-width: 120px; }
#lobby .seg { display: flex; gap: 5px; }
#lobby .seg button { height: 28px; min-width: 34px; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 7px; background: var(--stone); font: normal 14px "Lilita"; color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
#lobby .seg button.on { background: linear-gradient(#ffe7a6, #e7ae45); }
#lobby .lbl { font: 600 12px "Fredoka", system-ui, sans-serif; color: #e9e1cd; }
#lobby .sep { margin: 10px 0 9px; }
#lobby .msg { min-height: 15px; font: 600 12px/1.3 "Fredoka", system-ui, sans-serif; color: #ff9a88; }
#lobby .msg.ok { color: #b6ff7a; }
#lobby .big { font: normal 28px/1 "Lilita"; letter-spacing: 6px; color: #fff; text-shadow: var(--o); }
#lobby ul { list-style: none; margin: 0 0 8px; padding: 0; }
#lobby li { display: flex; align-items: center; gap: 7px; padding: 3px 0; margin: 0; }
#lobby li i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); background: #8f8676; flex: none; }
#lobby li i.on { background: #4cc93f; }
#lobby li.me { font-weight: 700; }
#lobby li small { color: #e9e1cd; font-weight: 600; }
/* the game in landscape at once (Benoit, 04/11): a phone held upright shows the whole page turned a quarter clockwise
   (ui/rotate.ts turns the touches back); the safe areas follow the turn, and the sizes measured on the screen are
   swapped (--vw, --vh: a hundredth of the page's width and height) */
:root { --vw: 1vw; --vh: 1vh; }
html.rot { --vw: calc(var(--ph) / 100); --vh: calc(var(--pw) / 100); }
html.rot body { position: fixed; top: 0; left: 0; width: var(--ph); height: var(--pw); transform-origin: 0 0; transform: translateX(var(--pw)) rotate(90deg);
  --l: max(16px, env(safe-area-inset-top, 0px)); --r: max(16px, env(safe-area-inset-bottom, 0px));
  --t: max(6px, env(safe-area-inset-right, 0px)); --b: max(10px, env(safe-area-inset-left, 0px)); }
</style>
<script>
// before anything draws: turned or not, and the screen's size for the turn (?rot turns it on a computer, for tests)
(function () {
  var d = document.documentElement, q = matchMedia('(orientation: portrait) and (pointer: coarse)'), f = /[?&]rot(&|$)/.test(location.search);
  function set() { d.style.setProperty('--pw', innerWidth + 'px'); d.style.setProperty('--ph', innerHeight + 'px'); d.classList.toggle('rot', q.matches || f); scrollTo(0, 0); }
  set(); addEventListener('resize', set); if (q.addEventListener) q.addEventListener('change', set);
})();
</script>
<canvas id="scene" aria-label="Ton village, la forêt, les autres villages au loin"></canvas>
<div id="loading"><span class="logo" id="load-logo"></span><span class="title n">Shardholm</span><div class="ctr"><span class="track"><i id="load-bar"></i></span></div><span class="step n" id="load-step">Chargement…</span></div>

<div class="hud" id="hud">
  <div class="tl">
    <div class="ctr cry" id="c-cry"><span class="track"><i></i></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-crystal"/></svg><span class="max n"></span></div>
    <div class="ctr mush" id="c-mush"><span class="track"><i></i></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-mushroom"/></svg><span class="max n"></span></div>
    <div class="ctr army" id="c-army" aria-label="Taille de l’armée"><span class="track"></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-swords"/></svg></div>
    <button class="ctr army runes" id="c-rune" aria-label="Tes runes" data-do="runes"><span class="track"></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-rune"/></svg></button>
  </div>
  <div class="tc">
    <div class="ctr builders" id="c-bld" aria-label="Ouvriers libres"><span class="track"></span><span class="v n">2/2</span><svg class="ic" aria-hidden="true"><use href="#i-hammer"/></svg></div>
    <div class="ctr nrg" id="c-nrg"><span class="track"><i></i></span><span class="v n">100</span><svg class="ic" aria-hidden="true"><use href="#i-energy"/></svg></div>
    <div class="ctr shield" id="c-shield" hidden aria-label="Bouclier"><span class="track"></span><span class="v n"></span><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg></div>
  </div>
  <div class="tr">
    <span class="n" id="version"></span>
    <button class="btn small neutral" id="btn-sound" aria-label="Le son : musique et bruitages"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-sound"/></svg></span></button>
    <button class="btn small neutral" id="btn-multi" aria-label="Jouer à plusieurs"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-person"/></svg></span><span class="badge code n" id="multi-lab"></span></button>
    <button class="btn small neutral" id="btn-away" aria-label="Avancer le monde d’une heure"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-hourglass"/></svg></span></button>
    <button class="btn small neutral" id="btn-speed" aria-label="Vitesse du temps"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-fast"/></svg></span><span class="badge n" id="speed-v">×1</span></button>
  </div>
  <div class="bl">
    <div class="units">
      <button class="ubtn" id="btn-army" aria-label="Armée"><span class="face"><img data-art="soldat-tete"><span class="tm n" id="tm-army"></span></span><span class="st"><svg class="ic" aria-hidden="true"><use id="st-army" href="#i-house"/></svg></span></button>
      <button class="ubtn" id="btn-harv" aria-label="Récolteur"><span class="face"><img data-art="recolteur-tete"><span class="tm n" id="tm-harv"></span></span><span class="st"><svg class="ic" aria-hidden="true"><use id="st-harv" href="#i-house"/></svg></span></button>
    </div>
    <button class="btn big nav" id="btn-view"><span class="face"><svg class="ic" aria-hidden="true"><use id="view-ic" href="#i-map"/></svg><span class="lab n" id="view-lab">Carte</span></span></button>
  </div>
  <div class="br">
    <button class="btn small neutral" id="btn-journal" aria-label="Journal"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg></span><span class="badge n" id="journal-n" hidden></span></button>
    <button class="btn big action" id="btn-build" data-do="shop"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-hammer"/></svg><span class="lab n">Construire</span></span></button>
  </div>
  <button class="incoming" id="incoming" hidden aria-label="Une attaque arrive"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span class="n" id="inc-n"></span><span class="n" id="inc-t"></span></span></button>
</div>

<div class="bname" id="sel-name" hidden></div>
<div class="acts" id="acts" hidden></div>
<div class="acts" id="wbar" hidden></div>

<div class="rhud" id="rhud" hidden>
  <div class="tl">
    <div class="ctr hp" id="r-hp"><span class="track"><i></i></span><span class="v n">900</span><svg class="ic" aria-hidden="true"><use href="#i-house"/></svg></div>
    <div class="ctr army" id="r-def"><span class="track"></span><span class="v n">0</span><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg></div>
  </div>
  <!-- the loot (validated 04/11, the raid's board): what the raid has taken so far, out of all it can take -->
  <div class="rloot" id="r-loot">
    <div class="lrow"><svg class="ic" aria-hidden="true"><use href="#i-crystal"/></svg><span class="n big" id="rl-crystal">0</span><span class="n of" id="rl-crystal-of">/ 0</span></div>
    <div class="lrow"><svg class="ic" aria-hidden="true"><use href="#i-mushroom"/></svg><span class="n big" id="rl-mushroom">0</span><span class="n of" id="rl-mushroom-of">/ 0</span></div>
    <div class="lrow" id="rl-runes"><svg class="ic" aria-hidden="true"><use href="#i-rune"/></svg><span class="n big" id="rl-rune">0</span><span class="n of" id="rl-rune-of">/ 0</span></div>
  </div>
  <div class="rwho" id="r-who"></div>
  <div class="rclock"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span class="n" id="r-clock">3:00</span></div>
  <button class="rretreat" id="retreat" aria-label="Retraite : les survivants rentrent"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-flag"/></svg><span class="n">Retraite</span></span></button>
  <div class="deck">
    <button class="dcard sel" id="pick-soldat" aria-label="Poser des soldats"><img data-art="soldat"><span class="cnt n" id="left-soldat">×0</span></button>
    <button class="dcard" id="pick-archere" aria-label="Poser des archères"><img data-art="archere"><span class="cnt n" id="left-archere">×0</span></button>
    <button class="dcard" id="pick-veteran" aria-label="Poser des vétérans" hidden><img data-art="veteran"><span class="cnt n" id="left-veteran">×0</span></button>
  </div>
</div>

<div id="toast" role="status" hidden></div>
<div id="guide" hidden><span class="gp"><img data-art="recolteur-tete" alt=""></span><span class="gt" id="guide-t"></span><button class="gx" id="guide-skip">Passer le tuto</button></div>
<div id="lobby" role="dialog" aria-label="Jouer à plusieurs"><div class="win lobby"><div class="ribbon plain"><span class="n" id="lobby-title">Jouer à plusieurs</span></div><button class="x" id="lobby-close" aria-label="Fermer"><span class="face"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></span></button><div class="well" id="lobby-body"></div></div></div>
<script type="module" src="./app-MGWIWY3P.js"></script>

</body>
</html>
