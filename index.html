@font-face { font-family: "Lilita"; src: url("${Fm}") format("woff"); font-display: block; }
@font-face { font-family: "Fredoka"; src: url("${Om}") format("woff"); font-weight: 600; font-display: block; }

:root {
  /* Palette */
  --ink: #1b1036;
  --violet: #3b2484;
  --violet-top: #6247c8;
  --violet-deep: #2c1a6a;
  --rim: rgba(196, 176, 255, .3);
  --lilac: #e6dcff;
  --gold: #ffc43a;
  --cyan: #3fd4ff;
  --coral: #ff6a57;
  --mint: #7be04a;
  --well: rgba(20, 10, 46, .82);
  /* Safe areas: real iPhones get their notch and home-indicator clearance, previews keep a small margin */
  --sl: max(12px, env(safe-area-inset-left, 0px));
  --sr: max(12px, env(safe-area-inset-right, 0px));
  --st: max(8px, env(safe-area-inset-top, 0px));
  --sb: max(10px, env(safe-area-inset-bottom, 0px));
  /* Outlined white type: 8-way outline plus a hard drop */
  --outline: 0 1.5px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 -1.5px 0 var(--ink),
    1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink), 0 2px 0 var(--ink);
  --outline-s: 0 1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink),
    .8px .8px 0 var(--ink), -.8px .8px 0 var(--ink), .8px -.8px 0 var(--ink), -.8px -.8px 0 var(--ink), 0 1.5px 0 var(--ink);
  /* Plate: the purple panel language shared by every chip and panel */
  --plate-bg: linear-gradient(var(--violet-top), var(--violet) 55%, #2e1b6c);
  --plate-shadow: 0 2px 0 var(--ink), 0 0 0 1.5px var(--rim), 0 2px 0 1.5px var(--rim), inset 0 1.5px 0 rgba(255, 255, 255, .3), inset 0 -2px 0 rgba(0, 0, 0, .18);
  --candy-shadow: 0 2.5px 0 var(--ink), 0 0 0 1.5px var(--rim), 0 2.5px 0 1.5px var(--rim);
}
* { box-sizing: border-box; }
body { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; color: #fff; -webkit-font-smoothing: antialiased; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: fixed; inset: 0; pointer-events: none; font-family: "Lilita", "Trebuchet MS", sans-serif; }
.ui > * { pointer-events: auto; }
:where(.ui) button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
/* Every component isolates its own layers so inner z-indexes never leak above sheets and popovers */
.plate, .candy, .rb, .res, .tile, .card, .lvl-badge, .pc, .ribbon { isolation: isolate; }
svg.ic { display: block; overflow: visible; flex: none; }
img.portrait-img { display: block; pointer-events: none; -webkit-user-drag: none; }

/* ---------- Type ---------- */
.t { font-family: "Lilita", sans-serif; color: #fff; text-shadow: var(--outline); letter-spacing: .2px; line-height: 1; }
.t-s { font-family: "Lilita", sans-serif; color: #fff; text-shadow: var(--outline-s); letter-spacing: .2px; line-height: 1; }
.cap { font-family: "Lilita", sans-serif; font-size: 10px; color: var(--lilac); text-shadow: var(--outline-s); line-height: 1; letter-spacing: .2px; }
.txt { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 11px; line-height: 1.25; color: #efe9ff; text-shadow: 0 1px 0 var(--ink); word-spacing: .08em; }
.no { color: #ff8b7b !important; }
.warn { color: #ffd35a !important; }
/* Information as last seen, out of sight (GDD \xA79). */
.stale { color: #b8a6ff !important; }

/* ---------- Plates and buttons ---------- */
.plate { position: relative; display: flex; align-items: center; border: 2px solid var(--ink); border-radius: 7px; background: var(--plate-bg); box-shadow: var(--plate-shadow); }
.chip { height: 24px; gap: 3px; padding: 0 8px 0 0; margin-left: 11px; }
.chip > .ic { width: 26px; height: 26px; margin: -4px 0 -4px -13px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.chip .v { font-size: 14px; white-space: nowrap; }
.v, .cost, .price, .count, .lbl { white-space: nowrap; }
.chip.alert { background: linear-gradient(#ff9b8b, #e8463a 55%, #b8261f); }
.chip.amber { background: linear-gradient(#ffe08a, #f0a020 55%, #c4700c); }

.candy { position: relative; display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); box-shadow: var(--candy-shadow); overflow: hidden; }
.candy::before { content: ""; position: absolute; left: 10%; right: 10%; top: 6%; height: 30%; border-radius: 999px; background: linear-gradient(rgba(255, 255, 255, .7), rgba(255, 255, 255, .12)); pointer-events: none; }
.candy::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 20%; background: rgba(27, 16, 54, .22); pointer-events: none; }
.candy > * { position: relative; z-index: 1; }
.candy.orange { background: linear-gradient(#ffd27a, #ff9a2a 45%, #f06810); }
.candy.green { background: linear-gradient(#c9ff8a, #66d43c 45%, #2f9e2c); }
.candy.blue { background: linear-gradient(#a8e2ff, #3fa0ff 45%, #1e5fd4); }
.candy.red { background: linear-gradient(#ffb0a0, #ff5a47 45%, #c22a20); }
.candy.violet { background: linear-gradient(#c3adff, #8461f2 45%, #5530c4); }
.candy.dim { background: linear-gradient(#6a52c8, #3d2789); }
.candy.dim::before { opacity: .35; }
.candy:active:not(:disabled) { transform: translateY(1.5px); box-shadow: 0 1px 0 var(--ink), 0 0 0 1.5px var(--rim); }
.candy:disabled { filter: grayscale(.85) brightness(.75); cursor: default; }
.round { border-radius: 50%; }

.btn { height: 32px; padding: 0 12px; gap: 5px; border-radius: 9px; font-size: 13.5px; white-space: nowrap; }
.btn.sm { height: 27px; padding: 0 9px; border-radius: 8px; font-size: 12px; }
.btn .ic { width: 18px; height: 18px; filter: drop-shadow(0 1px 0 rgba(27, 16, 54, .6)); }
.btn.sm .ic { width: 15px; height: 15px; }
.badge-dot { position: absolute; top: -4px; right: -4px; z-index: 4; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; border: 2px solid var(--ink); background: linear-gradient(#ff8f7f, #e8352a); display: flex; align-items: center; justify-content: center; font-size: 10.5px; box-shadow: 0 1.5px 0 var(--ink); }
.badge-dot.blue { background: linear-gradient(#a8e2ff, #2f8cf0); }

/* Round buttons with a label overlapping their lower edge */
.rb { position: relative; display: flex; flex-direction: column; align-items: center; padding-bottom: 9px; }
.rb > .candy { overflow: hidden; }
.rb .lbl { position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%); white-space: nowrap; z-index: 3; pointer-events: none; }
.rb.big > .candy { width: 64px; height: 64px; }
.rb.big > .candy .ic { width: 40px; height: 40px; margin-top: -5px; filter: drop-shadow(0 1.5px 0 rgba(27, 16, 54, .6)); }
.rb.big .lbl { font-size: 13.5px; bottom: 0; }
.rb.small > .candy { width: 44px; height: 44px; }
.rb.small > .candy .ic { width: 28px; height: 28px; margin-top: -3px; filter: drop-shadow(0 1px 0 rgba(27, 16, 54, .5)); }
.rb.small .lbl { font-size: 10.5px; }
.rb.mid > .candy { width: 50px; height: 50px; }
.rb.mid > .candy .ic { width: 32px; height: 32px; margin-top: -3px; filter: drop-shadow(0 1px 0 rgba(27, 16, 54, .5)); }
.rb.mid .lbl { font-size: 11.5px; }
.rb .badge-dot { top: -3px; right: -3px; }
.rb.on > .candy { box-shadow: 0 2.5px 0 var(--ink), 0 0 0 3px #ffd84a, 0 0 12px 3px rgba(255, 216, 74, .5); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.res-group { position: absolute; left: calc(var(--sl) + 6px); top: var(--st); width: 140px; display: flex; flex-direction: column; gap: 2px; }
.res { position: relative; }
.res .capline { display: flex; justify-content: flex-end; padding-right: 2px; margin-bottom: 2px; height: 10px; }
.res .bar { position: relative; height: 22px; margin-left: 10px; border: 2px solid var(--ink); border-radius: 7px; background: var(--plate-bg); box-shadow: var(--plate-shadow); }
.res .channel { position: absolute; left: 12px; right: 3px; top: 3px; bottom: 3px; border-radius: 4px; background: var(--well); overflow: hidden; }
.res .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 3px 3px 0; transition: width .4s; }
.res .fill::after { content: ""; position: absolute; left: 3px; right: 3px; top: 2px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .5); }
.res .fill.gold { background: linear-gradient(#ffe27a, #f7a21f 70%, #d9700c); }
.res .fill.cyan { background: linear-gradient(#a6f6ff, #2fbaf0 70%, #1478d0); }
.res .v { position: absolute; right: 7px; top: 50%; transform: translateY(-48%); font-size: 15px; }
.res > .ic { position: absolute; left: -6px; bottom: -6px; z-index: 2; width: 30px; height: 30px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.res.full .bar { box-shadow: var(--plate-shadow), 0 0 0 3px rgba(255, 216, 74, .65); }
.res-chips { display: flex; gap: 8px; margin-top: 5px; padding-left: 0; }
.res-chips .chip { width: 62px; justify-content: flex-end; margin-left: 10px; }
.res-chips .chip > .ic { position: absolute; left: -12px; top: -3px; margin: 0; }

.top-center { position: absolute; top: var(--st); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; }
.lvl { position: absolute; right: var(--sr); top: var(--st); display: flex; align-items: center; gap: 6px; }
.lvl .sys { text-align: right; }
.lvl .sys .t { font-size: 14px; }
.lvl .sys .cap { margin-top: 3px; }
.lvl-badge { position: relative; width: 34px; height: 34px; flex: none; }
.lvl-badge svg { position: absolute; inset: 0; width: 34px; height: 34px; filter: drop-shadow(0 2px 0 var(--ink)); }
.lvl-badge .n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; padding-top: 1px; }
.gear-btn { width: 30px; height: 30px; margin-left: 2px; }
.gear-btn .ic { width: 20px; height: 20px; }

.quest { position: absolute; left: calc(var(--sl) + 16px); top: calc(var(--st) + 108px); width: 196px; min-height: 40px; padding: 5px 9px 5px 34px; flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; border-radius: 9px; text-align: left; }
.quest .portrait { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: radial-gradient(circle at 50% 40%, #ffe9a8, #f2a33a 70%, #c9661d); box-shadow: 0 2px 0 var(--ink); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.quest .portrait img { width: 46px; height: 46px; margin-top: 2px; }
.quest .portrait .ic { width: 24px; height: 24px; }
.quest .what { font-size: 12px; line-height: 1.1; }
.quest .row2 { display: flex; align-items: center; gap: 6px; }
.quest .prog { flex: 1; height: 7px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--well); overflow: hidden; }
.quest .prog i { display: block; height: 100%; background: linear-gradient(#c9ff8a, #4cc93f); }
.quest .next { font-size: 10.5px; color: var(--lilac); }
/* Match: day and solar energy (top right), sieges under way (top center) */
.lvl .sys.day { cursor: pointer; pointer-events: auto; background: none; border: 0; padding: 0; color: inherit; font: inherit; display: flex; flex-direction: column; align-items: flex-end; }
.sun-score { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
.sun-score .ic { width: 20px; height: 20px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.sun-score span { font-size: 13px; color: #ffe08a; }
.sieges { position: absolute; top: calc(var(--st) + 54px); right: calc(var(--sr) + 4px); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto; }
.siege { width: 236px; min-height: 40px; padding: 5px 10px 6px 36px; flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; border-radius: 9px; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.siege:disabled { cursor: default; }
.siege .badge { position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 38%, #ffb3a6, #e8463a 65%, #a51f1a); }
.siege.mine .badge { background: radial-gradient(circle at 50% 38%, #fff0b8, #f0a020 65%, #b8640c); }
.siege .badge .ic { width: 26px; height: 26px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.siege.hit { animation: siege-pulse 1.4s ease-in-out infinite; }
@keyframes siege-pulse { 50% { box-shadow: var(--plate-shadow), 0 0 0 3px rgba(255, 106, 87, .45); } }
@media (prefers-reduced-motion: reduce) { .siege.hit { animation: none; } }
.siege .what { font-size: 12px; line-height: 1.1; }
.siege .row2 { display: flex; align-items: center; gap: 6px; }
.siege .prog { flex: 1; height: 8px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--well); overflow: hidden; }
.siege .prog i { display: block; height: 100%; background: linear-gradient(#c6f1ff, #3fa0ff); transition: width .6s ease-out; }
.siege .cap { font-size: 11px; white-space: nowrap; min-width: 30px; text-align: right; }
.siege .sub { font-size: 10.5px; line-height: 1.15; color: var(--lilac); }
/* Army families (match mode): a small tag on troop and defense tiles, and what stays home */
.fam { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 5px; font-size: 9.5px; white-space: nowrap; box-shadow: 0 1px 0 var(--ink); }
.tile .fam { position: absolute; left: 4px; bottom: 27px; z-index: 2; }
.tile.locked .fam { display: none; }
.lrow .t-s .fam { margin-left: 6px; vertical-align: 1px; }
.fam-mix { background: linear-gradient(#b4fff3, #2fbfb0 60%, #168a80); }
.fam-atk { background: linear-gradient(#ffb3a6, #e8463a 60%, #a51f1a); }
.fam-def { background: linear-gradient(#c6e4ff, #3f86e8 60%, #1e4fb4); }
.stay { gap: 6px; padding: 5px 9px; margin: 2px 2px 6px; border-radius: 8px; }
.stay .ic { width: 20px; height: 20px; flex: none; filter: drop-shadow(0 1px 0 var(--ink)); }
.stay span { font-size: 12px; }
.stay.empty { background: linear-gradient(#ff9b8b, #e8463a 55%, #b8261f); }
/* Match panel: the week, the relay, the ranking */
.match .week { flex-direction: column; align-items: stretch; gap: 7px; padding: 8px 10px 10px; margin: 4px 2px 10px; border-radius: 10px; }
.match .week .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.match .week .row1 .t { font-size: 15px; }
.days { display: flex; gap: 4px; }
.days .d { position: relative; flex: 1; height: 18px; border: 2px solid var(--ink); border-radius: 6px; background: var(--well); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.days .d i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#c6f1ff, #3fa0ff); }
.days .d.done i { background: linear-gradient(#9fd6ff, #2f7fe0); }
.days .d.relay { border-color: #6b4a00; box-shadow: inset 0 0 0 1.5px #ffd25a; }
.days .d span { position: relative; font-size: 10px; }
.relayrow { width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.relayrow .note { margin: 0; }
.sunbadge { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); background: radial-gradient(circle at 50% 38%, #fff3c4, #ffb21f 62%, #c46a0c); display: flex; align-items: center; justify-content: center; }
.sunbadge .ic { width: 26px; height: 26px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.ranking .rank { gap: 7px; padding: 6px 8px; margin-bottom: 6px; align-items: center; }
.ranking .rank .grow { gap: 4px; justify-content: center; }
.ranking .rank .grow > .t-s { display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.ranking .holder { display: inline-flex; }
.end-list .ranking .lv, .end-list .ranking .dot { display: none; }
.ranking .rank.me { background: linear-gradient(rgba(63, 212, 255, .28), rgba(20, 10, 46, .55)); box-shadow: inset 0 0 0 1.5px rgba(160, 240, 255, .55); }
.ranking .place { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 1.5px 0 var(--ink); display: flex; align-items: center; justify-content: center; font-size: 13px; background: linear-gradient(#8f7ccf, #5a45a8); }
.ranking .place.p1 { background: linear-gradient(#ffe9a0, #f0a020 60%, #b8640c); }
.ranking .place.p2 { background: linear-gradient(#f4f4ff, #b8b8d8 60%, #7a7aa0); }
.ranking .place.p3 { background: linear-gradient(#ffd0a8, #d27a3a 60%, #8e4a1c); }
.ranking .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.ranking .lv { font-size: 10.5px; color: var(--lilac); }
.ranking .holder .ic { width: 16px; height: 16px; margin-left: 4px; vertical-align: -3px; filter: drop-shadow(0 1px 0 var(--ink)); }
.ranking .sbar { height: 6px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--well); overflow: hidden; }
.ranking .sbar i { display: block; height: 100%; background: linear-gradient(#fff0a8, #ffb21f); }
.ranking .solar { flex: none; align-self: center; min-width: 42px; text-align: right; font-size: 14px; line-height: 1; color: #ffe08a; }
/* End of the week */
.match-end { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(12, 6, 30, .62); pointer-events: auto; animation: end-in .35s ease-out; }
@keyframes end-in { from { opacity: 0; } }
.end-board { position: relative; width: min(440px, calc(100vw - var(--sl) - var(--sr) - 8px)); max-height: calc(100vh - var(--st) - var(--sb) - 28px); padding: 22px 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.end-board .trophy { width: 54px; height: 54px; margin-top: -2px; animation: trophy-pop .6s cubic-bezier(.3, 1.6, .5, 1) both; }
.end-board .trophy .ic { width: 54px; height: 54px; filter: drop-shadow(0 2px 0 var(--ink)); }
@keyframes trophy-pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
.end-board .verdict { font-size: 19px; text-align: center; }
.end-board > .note { margin: 0 4px 2px; text-align: center; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: 100%; margin: 2px 0 6px; }
.podium .step { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.podium .who { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .orb { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.podium .step.s1 .orb { width: 36px; height: 36px; }
.podium .block { width: 100%; border: 2px solid var(--ink); border-radius: 9px 9px 4px 4px; box-shadow: 0 2px 0 var(--ink), inset 0 1.5px 0 rgba(255, 255, 255, .35); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4px; gap: 2px; }
.podium .s1 .block { height: 62px; background: linear-gradient(#ffe9a0, #f0a020 55%, #b8640c); }
.podium .s2 .block { height: 46px; background: linear-gradient(#f4f4ff, #b8b8d8 55%, #7a7aa0); }
.podium .s3 .block { height: 36px; background: linear-gradient(#ffd0a8, #d27a3a 55%, #8e4a1c); }
.podium .step.me .who { color: #a0f0ff; }
.podium .n { font-size: 18px; line-height: 1; }
.podium .pts { display: flex; align-items: center; gap: 1px; font-size: 11px; }
.podium .pts .ic { width: 14px; height: 14px; }
.end-list { width: 100%; flex: 1; min-height: 0; overflow-y: auto; padding: 0 2px; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
.end-acts { display: flex; gap: 10px; justify-content: center; align-items: center; padding-top: 6px; }
@media (prefers-reduced-motion: reduce) { .match-end, .end-board .trophy { animation: none; } }
@media (orientation: landscape) and (max-height: 430px) {
  .end-board { flex-direction: row; flex-wrap: wrap; align-content: flex-start; justify-content: center; padding-top: 20px; }
  .end-board .trophy { display: none; }
  .end-board .verdict, .end-board > .note { width: 100%; }
  .podium { width: 46%; margin: 0; }
  .end-list { width: 50%; max-height: 150px; }
  .end-acts { width: 100%; }
}
.assault-cta { animation: assault-bob 1.2s ease-in-out infinite; }
@keyframes assault-bob { 50% { transform: translateY(-2px) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { .assault-cta { animation: none; } }
@media (orientation: portrait) {
  .sieges { top: calc(var(--st) + 182px); }
  .siege { width: 214px; }
}

/* ---------- Corner buttons ---------- */
.corner { position: absolute; bottom: var(--sb); display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
.corner > * { pointer-events: auto; }
.corner.left { left: var(--sl); }
.corner.right { right: var(--sr); }
.corner .rb.small { margin-bottom: 1px; }

/* ---------- Sheets (boards) ---------- */
.board { position: absolute; z-index: 10; border: 2px solid var(--ink); border-radius: 14px; background: linear-gradient(var(--violet-top), var(--violet) 14%, var(--violet-deep)); box-shadow: 0 3px 0 var(--ink), 0 0 0 1.5px var(--rim), 0 3px 0 1.5px var(--rim), inset 0 1.5px 0 rgba(255, 255, 255, .28), inset 0 -3px 0 rgba(0, 0, 0, .18); }
.sheet { display: flex; flex-direction: column; }
.ribbon { position: absolute; left: 50%; top: -15px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; justify-content: center; height: 28px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 8px; background: linear-gradient(#ffd27a, #ff9a2a 50%, #f06810); box-shadow: 0 2.5px 0 var(--ink); font-size: 16px; white-space: nowrap; }
.ribbon::before { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 6px; border-radius: 4px; background: rgba(255, 255, 255, .45); }
.ribbon > * { position: relative; }
.ribbon.green { background: linear-gradient(#c9ff8a, #66d43c 50%, #2f9e2c); }
.ribbon.red { background: linear-gradient(#ffb0a0, #ff5a47 50%, #c22a20); }
.ribbon.blue { background: linear-gradient(#a8e2ff, #3fa0ff 50%, #1e5fd4); }
.close-btn { position: absolute; right: 6px; top: -12px; width: 30px; height: 30px; z-index: 6; }
.close-btn .ic { width: 15px; height: 15px; }
.sheet-head { display: flex; align-items: center; gap: 6px; padding: 20px 10px 8px; min-height: 26px; }
.sheet-head .spacer { flex: 1; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #b9a2ff rgba(20, 10, 46, .6); }
.sheet-body::-webkit-scrollbar { width: 4px; }
.sheet-body::-webkit-scrollbar-thumb { background: #b9a2ff; border-radius: 2px; }
.sheet-body::-webkit-scrollbar-track { background: rgba(20, 10, 46, .6); border-radius: 2px; }
.sheet-foot { padding: 0 10px 9px; }
.tabs { display: flex; gap: 5px; }
.tab { height: 26px; padding: 0 11px; border-radius: 8px; font-size: 12.5px; }
.note { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 11px; line-height: 1.3; color: #ece6ff; text-shadow: 0 1px 0 var(--ink); margin: 2px 2px 8px; word-spacing: .08em; }
.section { font-size: 13px; margin: 10px 2px 7px; }
.meter { height: 9px; border: 1.5px solid var(--ink); border-radius: 5px; background: var(--well); overflow: hidden; margin: 0 2px 10px; }
.meter i { display: block; height: 100%; background: linear-gradient(#c9ff8a, #4cc93f); }

/* Shop tiles */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; aspect-ratio: 1 / 1; border: 2px solid var(--ink); border-radius: 11px; overflow: hidden; box-shadow: 0 2.5px 0 var(--ink); text-align: center; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: 9px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .15); pointer-events: none; z-index: 4; }
.tile .bg { position: absolute; inset: 0; }
.cat-eco .bg, .cat-eco.pc { background: radial-gradient(circle at 50% 52%, #fff1c4 0%, #f7b04a 42%, #d06a1e 80%, #a8461a 100%); }
.cat-nrg .bg, .cat-nrg.pc { background: radial-gradient(circle at 50% 52%, #e6fdff 0%, #5ccdf0 42%, #2479c8 80%, #1b4f9c 100%); }
.cat-def .bg, .cat-def.pc { background: radial-gradient(circle at 50% 52%, #ffe0d8 0%, #ff8a70 42%, #d4423a 80%, #a52a2e 100%); }
.cat-mil .bg, .cat-mil.pc { background: radial-gradient(circle at 50% 52%, #e9ffd8 0%, #8ee06a 42%, #3d9c3a 80%, #276d2c 100%); }
.cat-sci .bg, .cat-sci.pc { background: radial-gradient(circle at 50% 52%, #f2e8ff 0%, #b892ff 42%, #6c42d0 80%, #4b2a9c 100%); }
.cat-troop .bg, .cat-troop.pc { background: radial-gradient(circle at 50% 42%, #c9fff4, #4fd6c8 45%, #19867e 100%); }
.cat-ship .bg, .cat-ship.pc { background: radial-gradient(circle at 50% 50%, #e3f4ff 0%, #78b8ff 42%, #2f6fd6 80%, #23479c 100%); }
.tile .name { position: absolute; left: 5px; right: 5px; top: 5px; text-align: center; font-size: 12px; line-height: 1.05; z-index: 2; }
.tile img { position: absolute; left: 50%; top: 55%; width: 72%; height: 72%; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 0 rgba(27, 16, 54, .45)); }
.tile .tag { position: absolute; right: 4px; top: 22px; z-index: 3; font-size: 11px; }
.tile .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 21px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 3px; background: rgba(20, 10, 46, .8); z-index: 2; }
.tile .price { display: flex; align-items: center; gap: 1px; font-size: 12.5px; }
.tile .price .ic { width: 17px; height: 17px; filter: drop-shadow(0 1px 0 var(--ink)); }
.tile .count { font-size: 11px; color: var(--lilac); }
.tile.sel { box-shadow: 0 2.5px 0 var(--ink), 0 0 0 3px #ffd84a, 0 0 12px 4px rgba(255, 216, 74, .55); z-index: 3; }
.tile.locked .bg, .tile.locked img { filter: grayscale(1) brightness(.6); }
.tile.locked .lockico { position: absolute; left: 50%; top: 52%; width: 30px; height: 30px; transform: translate(-50%, -50%); z-index: 2; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.tile.locked .foot { justify-content: center; color: #ffd98a; font-size: 11px; }
.tile.maxed img { filter: saturate(.6) brightness(.85) drop-shadow(0 2px 0 rgba(27, 16, 54, .45)); }
.tile .research-ic { position: absolute; left: 50%; top: 54%; width: 46%; height: 46%; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 0 rgba(27, 16, 54, .5)); }

/* Detail footer of a sheet */
.detail { min-height: 54px; padding: 6px 7px 6px 52px; gap: 8px; border-radius: 10px; }
.detail .pc { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; }
.detail .txtcol { flex: 1; min-width: 0; }
.detail .txtcol .t { font-size: 13px; }
.detail .txtcol .txt { font-size: 10.5px; margin-top: 3px; }
.detail .meta { display: flex; flex-direction: column; gap: 3px; flex: none; }
.detail .meta div { display: flex; align-items: center; gap: 2px; }
.detail .meta .costs { flex-direction: column; align-items: flex-start; gap: 2px; }
.detail .meta .ic { width: 17px; height: 17px; filter: drop-shadow(0 1px 0 var(--ink)); }
.detail .meta .t { font-size: 13px; }
.detail .meta .t-s { font-size: 11px; }
.detail .act { flex: none; }
.detail .act .btn { height: 34px; min-width: 76px; font-size: 14px; }

/* Portrait circle */
.pc { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 1.5px 0 var(--ink); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.pc img { width: 120%; height: 120%; margin-top: 6%; }
.pc .ic { width: 62%; height: 62%; }
.pc.gold { background: radial-gradient(circle at 50% 40%, #ffe9a8, #f2a33a 70%, #c9661d); }
.pc.red { background: radial-gradient(circle at 50% 45%, #ffe0d8, #ff8a70 50%, #c23a34); }
.pc.teal { background: radial-gradient(circle at 50% 42%, #c9fff4, #4fd6c8 45%, #19867e 100%); }
.pc.blue { background: radial-gradient(circle at 50% 50%, #e3f4ff, #78b8ff 50%, #2f6fd6); }
.pc.violet { background: radial-gradient(circle at 50% 50%, #f2e8ff, #b892ff 50%, #6c42d0); }

/* List rows inside boards */
.lrow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; margin-bottom: 7px; border: 2px solid var(--ink); border-radius: 10px; background: rgba(20, 10, 46, .5); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .12); }
.lrow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lrow .grow .t-s { font-size: 13px; line-height: 1.1; }
.lrow .acts { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
.lrow .acts.h { flex-direction: row; }
.costs { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cost { display: inline-flex; gap: 1px; align-items: center; font-size: 12.5px; }
.cost .ic { width: 16px; height: 16px; filter: drop-shadow(0 1px 0 var(--ink)); }
.costs.loss .cost { color: #ff8a7a; }
.stars { display: inline-flex; gap: 1px; align-items: flex-end; }
.stars .ic { width: 16px; height: 16px; filter: drop-shadow(0 1px 0 var(--ink)); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper .btn { width: 30px; padding: 0; font-size: 17px; }
.stepper .val { min-width: 26px; text-align: center; font-size: 15px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 8px; }

/* ---------- Selection popover (bottom center, Clash style) ---------- */
.pop { position: absolute; z-index: 8; left: 50%; bottom: var(--sb); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; width: max-content; max-width: max(250px, calc(100vw - 2 * var(--sl) - 472px)); }
.pop .ptitle { font-size: 16px; text-align: center; white-space: nowrap; }
.pop .ptitle .lv { font-size: 12px; color: var(--lilac); margin-left: 4px; }
.pop .pinfo { padding: 5px 10px; border-radius: 9px; border: 2px solid var(--ink); background: rgba(20, 10, 46, .72); text-align: center; max-width: 100%; }
.pop .pinfo .txt { font-size: 11px; }
.pop .pinfo .txt + .txt { margin-top: 2px; }
.pop .pacts { display: flex; gap: 10px; align-items: flex-start; justify-content: center; flex-wrap: wrap; margin-top: 2px; }
.pop .rb .sub { position: absolute; left: 50%; top: calc(100% + 1px); transform: translateX(-50%); white-space: nowrap; }
/* Every resource of a cost on one line under its button (the Noyau's Mass was wrapping off the screen). */
.pop .rb .sub .costs { flex-wrap: nowrap; gap: 6px; }

.hint { position: absolute; z-index: 8; left: 50%; bottom: var(--sb); transform: translateX(-50%); padding: 5px 6px 5px 12px; gap: 10px; border-radius: 10px; width: max-content; max-width: max(250px, calc(100vw - 2 * var(--sl) - 472px)); }
.hint .t-s { font-size: 13px; white-space: normal; flex: 1; min-width: 0; }
.hint > .btn { flex: none; }
.hint.top { bottom: auto; top: calc(var(--st) + 66px); padding: 5px 12px; pointer-events: none; }

/* ---------- Toasts ---------- */
#toasts { z-index: 30; position: absolute; top: max(calc(var(--st) + 32px), var(--tuto-clear, 0px)); left: 50%; transform: translateX(-50%); width: min(70vw, 380px); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { padding: 4px 11px 4px 4px; gap: 6px; border-radius: 9px; font-size: 12.5px; animation: toastIn .22s ease-out; }
.toast > .ic { width: 22px; height: 22px; filter: drop-shadow(0 1px 0 var(--ink)); }
.toast .t-s { line-height: 1.15; }
.toast.danger { background: linear-gradient(#ff9b8b, #e8463a 55%, #b8261f); }
.toast.success { background: linear-gradient(#a6e98a, #3fae3a 55%, #26802a); }
@keyframes toastIn { from { transform: translateY(-8px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 3D labels and edge indicators ---------- */
.label3d { position: absolute; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.label3d .plate { height: 20px; padding: 0 6px 0 0; gap: 2px; border-radius: 6px; margin-left: 9px; }
.label3d .plate.noic { padding: 0 7px; margin-left: 0; }
.label3d .plate .ic { width: 20px; height: 20px; margin: -3px 0 -3px -11px; filter: drop-shadow(0 1px 0 var(--ink)); }
.label3d .plate span { font-size: 11.5px; white-space: nowrap; }
.label3d .lbar { width: 44px; height: 6px; margin-top: 3px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--well); overflow: hidden; }
.label3d .lbar i { display: block; height: 100%; background: linear-gradient(#ffe27a, #f7a21f); }
.label3d.me .plate { background: linear-gradient(#b4fff3, #2fbfb0 55%, #168a80); }
.label3d.danger .plate { background: linear-gradient(#ff9b8b, #e8463a 55%, #b8261f); }
.label3d.gold .plate { background: linear-gradient(#ffe08a, #f0a020 55%, #c4700c); }
/* A planet out of sight: its label says how old the information is (GDD \xA79). */
.label3d.stale .plate { opacity: .82; background: linear-gradient(#6d5fa6, #463a7c 55%, #2f2660); }
.label3d.tap { pointer-events: auto; }
.label3d.below { transform: translate(-50%, 14px); }
/* An undiscovered planet of the ring: where it is, not who it is. */
.label3d.unknown { transform: translate(-50%, -50%); }
.label3d.unknown .plate { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 50%; border: 2px dashed rgba(206, 214, 255, 0.75); background: rgba(48, 38, 98, 0.45); box-shadow: none; }
.label3d.unknown .plate span { font-size: 15px; color: rgba(230, 234, 255, 0.9); }
.edge { position: absolute; width: 38px; height: 38px; transform: translate(-50%, -50%); font-size: 20px; }

/* ---------- Raid ---------- */
.raid-loot { position: absolute; left: calc(var(--sl) + 12px); top: var(--st); display: flex; flex-direction: column; }
.raid-loot .cap { margin: 0 0 4px -4px; }
.raid-loot .chip { height: 22px; min-width: 64px; justify-content: flex-end; margin-bottom: 7px; }

.raid-clock { position: absolute; left: 50%; top: var(--st); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
.raid-clock .plate { height: 26px; padding: 0 10px 0 0; gap: 3px; margin-left: 12px; }
.raid-clock .plate > .ic { width: 28px; height: 28px; margin: -4px 0 -4px -14px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.raid-clock .v { font-size: 16px; }
.raid-score { position: absolute; right: var(--sr); top: calc(var(--st) + 4px); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.score { width: 120px; height: 46px; flex-direction: column; justify-content: flex-end; padding-bottom: 6px; border-radius: 10px; }
.score .stars { position: absolute; left: 0; right: 0; top: -12px; justify-content: center; }
.score .stars .ic { width: 28px; height: 28px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.score .stars .ic.mid { width: 35px; height: 35px; }
.score .pct { font-size: 14px; }
.score .pct .cap { margin-left: 3px; }
.end-btn { height: 26px; padding: 0 9px 0 6px; gap: 4px; border-radius: 8px; font-size: 12px; }
.end-btn .ic { width: 16px; height: 16px; }
.deck { position: absolute; left: calc(var(--sl) + 2px); bottom: var(--sb); display: flex; align-items: flex-end; gap: 8px; }
.deck-cards { position: relative; display: flex; gap: 6px; align-items: flex-end; padding: 6px 7px 6px; border: 2px solid var(--ink); border-radius: 12px; background: linear-gradient(var(--violet-top), var(--violet) 18%, var(--violet-deep)); box-shadow: 0 3px 0 var(--ink), 0 0 0 1.5px var(--rim), 0 3px 0 1.5px var(--rim); }
.card { position: relative; width: 52px; height: 62px; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; box-shadow: 0 2.5px 0 var(--ink); background: radial-gradient(circle at 50% 42%, #c9fff4, #4fd6c8 45%, #19867e 100%); transition: transform .12s; }
.card::after { content: ""; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35); pointer-events: none; }
.card img { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; transform: translate(-50%, -42%); filter: drop-shadow(0 1.5px 0 rgba(27, 16, 54, .45)); }
.card .n { position: absolute; left: 4px; top: 3px; font-size: 13px; z-index: 2; }
.card .nm { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; display: flex; align-items: center; justify-content: center; background: rgba(20, 10, 46, .8); font-size: 9.5px; z-index: 2; }
.card.sel { transform: translateY(-6px); box-shadow: 0 2.5px 0 var(--ink), 0 0 0 3px #ffd84a, 0 0 12px 4px rgba(255, 216, 74, .55); }
.card:disabled { filter: grayscale(.9) brightness(.7); }
.deck .multi { margin-bottom: 4px; }
.deck .multi .candy { font-size: 14px; }
.strike-wrap { position: absolute; right: var(--sr); bottom: var(--sb); }
.replay-bar { position: absolute; left: 50%; bottom: var(--sb); transform: translateX(-50%); display: flex; gap: 8px; align-items: flex-end; }
.raid-target { position: absolute; left: calc(var(--sl) + 6px); top: var(--st); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.raid-target .plate { height: 26px; padding: 0 10px; font-size: 14px; }
.raid-target .cap { padding-left: 2px; }
.overlay-center { position: absolute; z-index: 20; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(12, 6, 32, .55); }
.result { position: relative; width: min(340px, 90vw); padding: 30px 18px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.result .big-stars { display: flex; gap: 2px; align-items: flex-end; justify-content: center; margin-top: -4px; }
.result .big-stars .ic { width: 46px; height: 46px; filter: drop-shadow(0 2px 0 var(--ink)); }
.result .big-stars .ic.mid { width: 58px; height: 58px; }
.result .loot { display: flex; gap: 14px; justify-content: center; }

/* ---------- Portrait orientation ---------- */
@media (orientation: portrait) {
  .res-group { width: 132px; }
  .top-center { top: calc(var(--st) + 2px); left: auto; right: var(--sr); transform: none; flex-direction: column; align-items: flex-end; top: calc(var(--st) + 44px); }
  .quest { top: calc(var(--st) + 108px); width: 186px; }
  .corner { flex-direction: column-reverse; align-items: center; gap: 12px; }
  .corner.right .rb.big { order: -1; }
  .sheet { left: 10px; right: 10px; bottom: var(--sb); height: 60vh; top: auto; width: auto; }
  .pop, .hint { max-width: calc(100vw - 2 * var(--sl) - 168px); }
  .sheet-open .corner, .sheet-open .quest { display: none; }
  .raid-score { top: calc(var(--st) + 40px); }
  .deck { flex-direction: column-reverse; align-items: flex-start; }
  .replay-bar { bottom: calc(var(--sb) + 10px); }
  #toasts { top: max(calc(var(--st) + 172px), var(--tuto-clear, 0px)); width: calc(100vw - 40px); }

}

}

.pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.pin .pb::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; }

.pin .pn { height: 19px; padding: 0 6px; border-radius: 6px; }
.pin .pn span { font-size: 11px; white-space: nowrap; }
.pin .pbar { position: absolute; left: 30px; top: 21px; width: 40px; height: 5px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--well); overflow: hidden; }
.pin .pbar i { display: block; height: 100%; background: linear-gradient(#ffe27a, #f7a21f); }
.pin.noname .pn, .pin.nobar .pbar { display: none; }
.pin.me .pb, .pin.me .pn { background: linear-gradient(#b4fff3, #2fbfb0 55%, #168a80); }
.pin.danger .pb, .pin.danger .pn { background: linear-gradient(#ff9b8b, #e8463a 55%, #b8261f); }
.pin.gold .pb, .pin.gold .pn { background: linear-gradient(#ffe08a, #f0a020 55%, #c4700c); }
.pin.pirate .pb { background: linear-gradient(#e0739a, #a3305e 55%, #6e1a3c); }
.pin.sun .pb { background: radial-gradient(circle at 50% 40%, #fff3c4, #ffc04a 55%, #e0791c); }
.pin.stale .pn { background: linear-gradient(#6d5fa6, #463a7c 55%, #2f2660); }
.pin.big { transform: translate(-50%, -100%); }
.pin.big .pb { display: none; }
.pin.big .pbar { position: static; margin: 3px auto 0; }

.site .sum { display: flex; flex-direction: column; gap: 4px; padding: 7px 8px 8px; margin: 0 2px 8px; border: 2px solid var(--ink); border-radius: 10px; background: rgba(20, 10, 46, .5); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .12); }
.site .sum .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-bottom: 2px; }
.site .sum .cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.site .sum .cell .top { display: flex; align-items: center; gap: 3px; }
.site .sum .cell .top .ic { width: 18px; height: 18px; flex: none; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.site .sum .cell .lab { font-size: 11px; line-height: 1; color: var(--lilac); }
.site .sum .cell .val { font-size: 15px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site .sum .sub { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 10.5px; line-height: 1.25; color: #d8d0f4; text-shadow: 0 1px 0 var(--ink); }
.site .sum .sub.warn { color: #ffd36b; }
.site .sum .sbar { height: 7px; border: 1.5px solid var(--ink); border-radius: 5px; background: var(--well); overflow: hidden; }
.site .sum .sbar i { display: block; height: 100%; }
.site .sum .sbar.left i { background: linear-gradient(#ffe7a0, #e0a03a); }
.site .sum .sbar.plasma i { background: linear-gradient(#b4f4ff, #2fb6e0); }
.site .sum .sbar.depot i { background: linear-gradient(#c9ff8a, #4cc93f); }
.site .sum .sbar.full i { background: linear-gradient(#ffb48a, #e8603a); }
.site .tile .lvlpip { position: absolute; left: 5px; top: 22px; font-size: 10px; }
.site .tile.core .bg { filter: saturate(.55); }
.site .tile.add .bg { opacity: .55; }
.site .tile.add .tag { top: 17px; font-size: 18px; color: #c9ff8a; }
.site .gar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 2px 8px; }
.site .gar .plate { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px 0 4px; border-radius: 8px; }
.site .gar .plate .ic { width: 20px; height: 20px; }
.site .gar .plate span { font-size: 12px; }
.site .dry { border-color: #ffd36b; }
.empire-line { display: flex; align-items: center; gap: 7px; flex: none; width: max-content; height: 28px; margin: 0 0 0 2px; padding: 0 9px 0 5px; border-radius: 9px; pointer-events: auto; cursor: pointer; }
.res-chips > .chip { flex: none; }
.empire-line .it { display: flex; align-items: center; gap: 2px; }
.empire-line .it .ic { width: 19px; height: 19px; filter: drop-shadow(0 1.5px 0 var(--ink)); }
.empire-line .it .v { font-size: 12.5px; line-height: 1; }
.empire-line .it .v small { font-size: 9.5px; opacity: .8; }
.popcurve { margin: 0 2px 8px; padding: 8px 10px 6px; border: 2px solid var(--ink); border-radius: 10px; background: rgba(20, 10, 46, .5); }
.popcurve .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.popcurve .row1 .t { font-size: 15px; }
.popcurve svg { display: block; width: 100%; height: 62px; overflow: visible; }
.popcurve .axis { display: flex; justify-content: space-between; }
.popcurve .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 8px; margin-top: 6px; }
.popcurve .stats div { display: flex; flex-direction: column; align-items: center; }
.popcurve .stats .t { font-size: 14px; }
.research-pips { display: flex; gap: 3px; margin-top: 3px; }
.research-pips i { width: 14px; height: 7px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--well); }
.research-pips i.on { background: linear-gradient(#e2c8ff, #9a63e8); }
.research-pips i.n3 { border-color: #ffd36b; }
.research-pips i.n3.locked { opacity: .5; }
.elim-veil { position: absolute; inset: 0; z-index: 46; display: flex; align-items: center; justify-content: center; background: rgba(12, 6, 32, .66); pointer-events: auto; }
.elim-board { width: min(380px, 92vw); padding: 30px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
.elim-board .skull { width: 58px; height: 58px; filter: drop-shadow(0 3px 0 var(--ink)); }
.elim-board .verdict { font-size: 19px; text-align: center; }
.elim-board .note { text-align: center; margin: 0 4px; }
.elim-board .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: 100%; }
.elim-board .stats .plate { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: 9px; }
.elim-board .stats .t { font-size: 16px; }
.elim-board .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
@media (max-height: 520px) {
  .elim-board { width: min(620px, 94vw); padding-top: 24px; gap: 6px; }
  .elim-board .skull { display: none; }
  .elim-board .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
