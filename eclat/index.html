<!-- the auto-battler's page: the shell's rotation and screen size are carte.html's own (a phone held upright turns
     the page a quarter, the screen's size is measured again after anything that may change it) -->
<script>
// before anything draws: turned or not, and the screen's size (?rot turns it on a computer, for tests). The game
// installed on an iPhone is given a window too short by the status bar after a turn or a return to the app, and
// the page's ground showed under it as a green band (Benoit, 05/11): there, the screen's own size is the size; and
// everywhere the size is measured again a moment after anything that may change it, as it comes late.
// 11/11 (Benoit, the band still there at launch): since iOS 26 an installed web app's window is shorter than the
// screen by the status bar while it draws from the screen's top (WebKit bugs 301994, 316008), and navigator.standalone
// alone missed the app opened from its manifest: installed is also the display mode, on any Apple touch screen; and
// there the large viewport (100lvh, the screen's full height in those apps) is measured too.
(function () {
  var d = document.documentElement, q = matchMedia('(orientation: portrait) and (pointer: coarse)'), f = /[?&]rot(&|$)/.test(location.search);
  var port = matchMedia('(orientation: portrait)');
  var apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  function installed() {
    return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches;
  }
  var probe = null;
  function large() {
    if (!probe) {
      probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;width:100lvw;height:100lvh;visibility:hidden;pointer-events:none';
      d.appendChild(probe);
    }
    return { w: probe.offsetWidth || 0, h: probe.offsetHeight || 0 };
  }
  function set() {
    // the largest of what the browser says (08/11, Benoit: at launch a green band on one side, gone only by turning
    // the phone: one of these comes late and right while another stays wrong)
    var e = d.clientWidth || 0, eh = d.clientHeight || 0, v = window.visualViewport;
    var w = Math.max(innerWidth, e, v ? Math.round(v.width * v.scale) : 0), h = Math.max(innerHeight, eh, v ? Math.round(v.height * v.scale) : 0);
    if (apple && installed() && screen.width && screen.height) {
      var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height), l = large();
      w = Math.max(w, l.w, port.matches ? a : b); h = Math.max(h, l.h, port.matches ? b : a);
    }
    if (window.__screen && window.__screen.w === w && window.__screen.h === h && d.classList.contains('rot') === (q.matches || f)) return;
    window.__screen = { w: w, h: h };
    d.style.setProperty('--pw', w + 'px'); d.style.setProperty('--ph', h + 'px'); d.classList.toggle('rot', q.matches || f); scrollTo(0, 0);
  }
  var later = 0;
  function soon() { set(); clearTimeout(later); later = setTimeout(function () { set(); later = setTimeout(set, 600); }, 150); }
  set(); addEventListener('resize', soon); addEventListener('orientationchange', soon); addEventListener('pageshow', soon);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) soon(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', soon);
  if (q.addEventListener) q.addEventListener('change', soon);
  // and measured again without waiting for an event: often in the first seconds (when the app opens), then now and
  // then (nothing changes when nothing moved)
  var n = 0, tick = setInterval(function () { set(); if (++n >= 20) { clearInterval(tick); setInterval(set, 2000); } }, 250);
})();
</script>
<!-- the page's ground and its quarter turn, here and not in style.css (11/11, Benoit: at launch the boot screen stood
     upright over a white band, then the hub came turned): they apply before the code comes, the boot screen included -->
<style id="shell-css">
/* the page's ground, under the arena: the colour at the edge of the map's painting (backdrop.ts EDGE, set by arena.ts
   for each map; the sea here), so a band left by a late size reads as the painting's own edge */
html, body { margin: 0; overflow: hidden; background: #34617f; }
#scene { position: fixed; top: 0; left: 0; width: var(--pw, 100%); height: var(--ph, 100%); display: block; touch-action: none; }
html.rot #scene { width: 100%; height: 100%; }
/* in landscape at once, as the game (pages/carte.html, whose script this page copies): a phone held upright shows the
   whole page turned a quarter clockwise (ui/rotate.ts turns the touches back), the safe areas follow the turn */
:root { --vw: 1vw; --vh: 1vh;
  --l: max(16px, env(safe-area-inset-left, 0px)); --r: max(16px, env(safe-area-inset-right, 0px));
  --t: max(6px, env(safe-area-inset-top, 0px)); --b: max(10px, env(safe-area-inset-bottom, 0px)); }
html.rot { --vw: calc(var(--ph) / 100); --vh: calc(var(--pw) / 100); }
html.rot body { position: fixed; top: 0; left: 0; width: var(--ph); height: var(--pw); transform-origin: 0 0; transform: translateX(var(--pw)) rotate(90deg);
  --l: max(16px, env(safe-area-inset-top, 0px)); --r: max(16px, env(safe-area-inset-bottom, 0px));
  --t: max(6px, env(safe-area-inset-right, 0px)); --b: max(10px, env(safe-area-inset-left, 0px)); }
</style>
