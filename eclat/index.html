// keep a copy of the app on the phone: it opens even when the network is slow, and updates when it can
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
// hide the loading screen once the game has drawn its first frame
(function wait() { if (window.__ready) { var l = document.getElementById('loading'); if (l) l.remove(); } else setTimeout(wait, 150); })();
</script>

<!-- the auto-battler's page: the shell's rotation and screen size are carte.html's own (a phone held upright turns
     the page a quarter, the screen's size is measured again after anything that may change it) -->
<script>
// before anything draws: turned or not, and the screen's size (?rot turns it on a computer, for tests). The game
// installed on an iPhone is given a window too short by the status bar after a turn or a return to the app, and
// the page's ground showed under it as a green band (Benoit, 05/11): there, the screen's own size is the size; and
// everywhere the size is measured again a moment after anything that may change it, as it comes late.
(function () {
  var d = document.documentElement, q = matchMedia('(orientation: portrait) and (pointer: coarse)'), f = /[?&]rot(&|$)/.test(location.search);
  var port = matchMedia('(orientation: portrait)'), ios = navigator.standalone === true;
  function set() {
    var w = innerWidth, h = innerHeight;
    if (ios && screen.width && screen.height) {
      var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height);
      w = Math.max(w, port.matches ? a : b); h = Math.max(h, port.matches ? b : a);
    }
    window.__screen = { w: w, h: h };
    d.style.setProperty('--pw', w + 'px'); d.style.setProperty('--ph', h + 'px'); d.classList.toggle('rot', q.matches || f); scrollTo(0, 0);
  }
  var later = 0;
  function soon() { set(); clearTimeout(later); later = setTimeout(function () { set(); later = setTimeout(set, 600); }, 150); }
  set(); addEventListener('resize', soon); addEventListener('orientationchange', soon); addEventListener('pageshow', soon);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) soon(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', soon);
  if (q.addEventListener) q.addEventListener('change', soon);
})();
</script>
